<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fondaco</title>
<meta name="description" content="Fondaco: commercio tra i porti del Mediterraneo nel 1230.">
<meta name="theme-color" content="#d3e4c5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Alegreya SC';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-sc-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya SC';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-sc-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/alegreya-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/alegreya-sans-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Alegreya';font-style:italic;font-weight:700;font-display:swap;src:url(fonts/alegreya-latin-700-italic.woff2) format('woff2')}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root {
  --verdino: #e3eed8;
  --verdino-2: #d3e4c5;
  --verdino-3: #bfd6ad;
  --celeste: #d8ebf6;
  --celeste-2: #c1dff0;
  --celeste-chiaro: #eef7fc;
  --giallino: #fff3bd;
  --giallino-2: #ffe794;
  --ink: #1d2922;
  --ink-2: #44564a;
  --ink-3: #66776a;
  --line: #2b3a30;
  --porpora: #8c2d22;
  --verde: #27613a;
  --blu: #1d4b72;
  --up: #17652b;
  --down: #a3261c;
  --sea: #cfe6f2;
  --land: #eef2dc;
  --coast: #2d3a30;
  --r: 10px;
  --navH: 66px;
  --f-disp: 'Alegreya SC', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --f-body: 'Alegreya Sans', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --shadow: 0 1px 0 rgba(29, 41, 34, .08), 0 8px 22px -10px rgba(29, 41, 34, .45);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--verdino);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 18.5px;
  line-height: 1.42;
  -webkit-tap-highlight-color: transparent;
  font-variant-numeric: lining-nums;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--porpora); outline-offset: 2px; }
.ic { width: 1.4em; height: 1.4em; flex: none; }
.num, .tab { font-variant-numeric: lining-nums tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
h1, h2, h3 { text-wrap: balance; }

/* ---------- schermata iniziale ---------- */
.title {
  position: relative;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding-inline: 16px;
  padding-block: 28px;
  overflow: hidden;
  background: var(--sea);
}
.title-map { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-card {
  position: relative;
  width: min(520px, 100%);
  background: var(--verdino);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 26px 22px 22px;
  box-shadow: var(--shadow);
  display: grid;
  gap: 16px;
}
.brand { text-align: center; display: grid; gap: 2px; }
.brand h1 {
  margin: 0;
  font-family: var(--f-disp);
  font-weight: 700;
  font-size: clamp(48px, 13vw, 70px);
  line-height: 1;
  letter-spacing: .05em;
  color: var(--porpora);
}
.brand .sub { font-family: var(--f-disp); font-size: 20px; letter-spacing: .12em; color: var(--ink-2); }
.brand .year { font-size: 15.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
.intro { margin: 0; font-size: 18.5px; color: var(--ink-2); }
.form { display: grid; gap: 12px; background: var(--celeste); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; }
.field { display: grid; gap: 5px; }
.field > span { font-size: 15.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.field > span small { text-transform: none; letter-spacing: 0; font-weight: 500; }
.inp {
  width: 100%;
  min-height: 46px;
  padding: 8px 12px;
  font-size: 19px;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--celeste-chiaro);
}
.inp:not(:placeholder-shown) { background: var(--giallino); }
.inp::placeholder { color: var(--ink-3); opacity: 1; }
.saved { background: var(--giallino); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.saved p { margin: 0; }
.stack { display: grid; gap: 10px; }

/* ---------- pulsanti ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 18px;
  font-weight: 800;
  font-size: 19px;
  letter-spacing: .02em;
  border: 2px solid var(--line);
  border-radius: 9px;
  background: var(--celeste);
  color: var(--ink);
  transition: transform .08s ease, filter .15s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.buy { background: var(--verde); color: #fff; }
.btn.sell { background: var(--blu); color: #fff; }
.btn.main { background: var(--porpora); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; font-size: 16.5px; padding: 6px 12px; }
.linkbtn { background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); font-size: 17.5px; justify-self: center; }

/* ---------- barra superiore ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--verdino-2);
  border-bottom: 2px solid var(--line);
}
.top-in {
  max-width: 800px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.where { font-family: var(--f-disp); font-weight: 700; font-size: 25px; line-height: 1.05; color: var(--porpora); }
.when { font-size: 15.5px; color: var(--ink-2); }
.top-r { display: grid; justify-items: end; gap: 3px; }
.purse { display: flex; align-items: center; gap: 6px; font-size: 23px; font-weight: 800; }
.purse .ic { width: 22px; height: 22px; }
.purse small { font-size: 15.5px; font-weight: 500; color: var(--ink-2); }
.purse b { transition: color .3s ease; border-radius: 6px; padding-inline: 3px; }
.purse b.flash-up { color: var(--up); background: #d7f0d9; }
.purse b.flash-down { color: var(--down); background: #f6dcd8; }
.hold { display: flex; align-items: center; gap: 7px; font-size: 15.5px; color: var(--ink-2); }
.bar { display: block; width: 74px; height: 9px; border: 1.5px solid var(--line); border-radius: 5px; background: var(--celeste-chiaro); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blu); }

/* ---------- corpo e navigazione ---------- */
.view {
  max-width: 800px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 14px calc(var(--navH) + env(safe-area-inset-bottom, 0px) + 28px);
  display: grid;
  gap: 14px;
}
.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: var(--verdino-2);
  border-top: 2px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-in { max-width: 800px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button {
  position: relative;
  height: var(--navH);
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  background: none;
  border: 0;
  color: var(--ink-2);
  font-size: 15px;
  font-weight: 700;
}
.nav button .ic { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--celeste); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 4px; background: var(--porpora); border-radius: 0 0 4px 4px; }
.nav button:disabled { opacity: .45; }

/* ---------- porto ---------- */
.port { display: grid; gap: 8px; }
.port-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.port h1 { margin: 0; font-family: var(--f-disp); font-size: 30px; line-height: 1.1; }
.tag { font-size: 14.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.desc { margin: 0; color: var(--ink-2); max-width: 62ch; }
.spec { display: grid; gap: 6px; }
.spec > div { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.spec .lbl { font-size: 14.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); min-width: 70px; }
.gchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 4px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--celeste-chiaro); font-size: 16.5px; font-weight: 500; }
.gchip .ic { width: 22px; height: 22px; }
.news { margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; background: var(--giallino); border: 1.5px solid var(--line); border-radius: 8px; font-size: 17.5px; }
.news .ic { width: 20px; height: 20px; margin-top: 1px; color: var(--porpora); }

/* ---------- mercato: merci di scambio ---------- */
.trade { background: var(--celeste); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
.trade-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; padding: 10px 12px; background: var(--verdino-2); border-bottom: 2px solid var(--line); }
.trade-h h2 { margin: 0; font-family: 'Alegreya', var(--f-disp); font-style: italic; font-weight: 700; font-size: 27px; line-height: 1.1; color: var(--porpora); }
.trade-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 16.5px; color: var(--ink-2); }
.trade-info b { color: var(--ink); }
.lim { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; }
.lim .inp { width: 78px; min-height: 40px; padding: 4px 8px; text-align: center; font-size: 18px; }
.trow {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(0, .85fr) minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, .8fr) minmax(0, .85fr);
  align-items: center;
  gap: 5px;
  min-height: 52px;
  padding: 5px 8px;
  border-top: 1px solid rgba(43, 58, 48, .2);
  transition: background .3s ease;
}
.trow.thead { background: var(--line); color: var(--celeste); min-height: 0; padding-block: 8px; border-top: 0; font-size: 13.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.trow.thead span { text-align: center; }
.trow.thead span:first-child { text-align: left; }
.trow.thead span:nth-child(2), .trow.thead span:nth-child(5), .trow.thead span:nth-child(6) { text-align: right; }
.trow.has { box-shadow: inset 5px 0 0 var(--porpora); background: #e9f4fb; }
.trow.flash { background: var(--giallino); }
.tname { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 4px 0; border: 0; background: none; text-align: left; font-size: 18px; font-weight: 500; color: var(--ink); }
.tname .ic { width: 30px; height: 30px; }
.tname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow.has .tname span { font-weight: 800; }
.tporto, .tstiva, .tmed { text-align: right; font-size: 18px; font-variant-numeric: lining-nums tabular-nums; }
.tporto, .tmed { color: var(--ink-2); font-size: 16.5px; }
.tstiva { font-weight: 800; }
.pbtn {
  width: 100%;
  max-width: 112px;
  justify-self: center;
  height: 42px;
  padding: 0 4px;
  border: 2px solid var(--line);
  border-radius: 21px;
  background: var(--giallino);
  font-size: 19px;
  font-weight: 800;
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--ink);
  box-shadow: 0 2px 0 rgba(29, 41, 34, .35);
  transition: transform .06s ease, background .15s ease;
}
.pbtn:hover { background: var(--giallino-2); }
.pbtn:active { transform: translateY(2px); box-shadow: none; }
.pbtn.up { color: var(--up); }
.pbtn.down { color: var(--down); }
.pbtn[aria-disabled="true"] { background: transparent; box-shadow: none; border-style: dashed; border-color: rgba(43, 58, 48, .45); color: var(--ink-3); font-weight: 600; }
.qbar {
  position: sticky;
  bottom: calc(var(--navH) + env(safe-area-inset-bottom, 0px) + 10px);
  z-index: 15;
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--verdino-2);
  border: 2px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.qlbl { font-size: 13.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin-right: 2px; }
.qb { min-width: 56px; height: 46px; padding: 0 12px; border: 2px solid var(--line); border-radius: 23px; background: var(--celeste); font-size: 19px; font-weight: 800; }
.qb[aria-pressed="true"] { background: var(--porpora); color: #fff; }
.wait { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.wait small { color: var(--ink-2); font-size: 16px; flex: 1 1 220px; }
.bank { background: var(--giallino); }

/* ---------- mappa ---------- */
.view.full { max-width: 1200px; padding-block-end: 0; }
.mapwrap {
  position: relative;
  height: var(--mapH, 60vh);
  background: #16457f;
  border: 2px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#map { display: block; width: 100%; height: 100%; cursor: grab; }
#map.dragging { cursor: grabbing; }
#map .map-edge { fill: none; stroke: #1d2922; stroke-width: 2; vector-effect: non-scaling-stroke; }
#map .sea-lbl { font-family: 'Alegreya', var(--f-disp); font-style: italic; font-weight: 700; fill: rgba(232, 244, 255, .82); letter-spacing: .22em; font-size: calc(12.5px / var(--z, 1)); }
#map .land-lbl { font-family: var(--f-disp); fill: rgba(52, 44, 26, .62); letter-spacing: .24em; font-size: calc(11.5px / var(--z, 1)); paint-order: stroke; stroke: rgba(245, 240, 215, .45); stroke-width: calc(2.5px / var(--z, 1)); }
#map .city { cursor: pointer; }
#map .city .hit { fill: transparent; }
#map .city .dot { fill: url(#redg); stroke: #3a0d08; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
#map .city .ring { fill: none; stroke: #fff3bd; stroke-width: 3; vector-effect: non-scaling-stroke; display: none; }
#map .city.here .ring { display: inline; }
#map .city.sel .ring { display: inline; stroke: #ffffff; stroke-dasharray: 4 3; }
#map .city text {
  font-family: 'Alegreya', var(--f-disp);
  font-style: italic;
  font-weight: 700;
  font-size: calc(17.5px / var(--z, 1));
  fill: #1b1812;
  paint-order: stroke;
  stroke: #fbf6e4;
  stroke-width: calc(4.5px / var(--z, 1));
  stroke-linejoin: round;
}
#map .city.sel text { fill: var(--porpora); }
#map .prod rect { fill: rgba(250, 246, 232, .93); stroke: #2b3a30; stroke-width: 1.2; }
#map.far .prod { display: none; }
#map .routebg { fill: none; stroke: rgba(15, 25, 35, .5); stroke-linecap: round; stroke-linejoin: round; }
#map .route { fill: none; stroke: #fff6d6; stroke-linecap: round; stroke-linejoin: round; }
#map .wake { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.mapctl { position: absolute; top: 10px; right: 10px; display: grid; gap: 8px; }
.mapctl button { width: 46px; height: 46px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 9px; background: var(--celeste); font-size: 26px; font-weight: 800; line-height: 1; box-shadow: var(--shadow); }
.mapctl .ic { width: 24px; height: 24px; }
.maphint { position: absolute; left: 10px; top: 10px; max-width: calc(100% - 84px); margin: 0; padding: 6px 10px; background: rgba(238, 247, 252, .92); border: 1.5px solid var(--line); border-radius: 8px; font-size: 16px; color: var(--ink-2); }
.sheet {
  position: absolute;
  left: 10px; right: 10px; bottom: 10px;
  max-height: calc(100% - 20px);
  overflow: auto;
  background: var(--celeste);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow);
  display: grid;
  gap: 8px;
}
.sheet .sh-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet h2 { margin: 0; font-family: var(--f-disp); font-size: 26px; color: var(--porpora); line-height: 1.1; }
.sheet p { margin: 0; }
.sheet .trip { font-size: 18.5px; }
.sheet .known { font-size: 16.5px; color: var(--ink-2); }
.specline { font-size: 17px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.specline b { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); min-width: 66px; }
.sg { display: inline-flex; align-items: center; gap: 3px; }
.sg .ic { width: 20px; height: 20px; }
.sh-act { display: flex; gap: 10px; flex-wrap: wrap; }
.sh-act .btn { flex: 1 1 auto; }
.sh-act .btn.ghost { flex: 0 0 auto; }
.xbtn { width: 42px; height: 42px; border: 2px solid var(--line); border-radius: 9px; background: var(--celeste-chiaro); font-size: 24px; line-height: 1; font-weight: 700; }
.voyage {
  position: absolute;
  left: 10px; right: 66px; top: 10px;
  max-width: 540px;
  background: rgba(255, 243, 189, .96);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  display: grid;
  gap: 6px;
  box-shadow: var(--shadow);
}
.voyage b.dest { font-family: var(--f-disp); font-size: 22px; color: var(--porpora); }
.voyage .vrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.voyage .days { font-size: 18.5px; font-weight: 700; }
.voyage ul { margin: 0; padding-left: 18px; font-size: 16.5px; color: var(--ink-2); display: grid; gap: 2px; }
.vbar { height: 8px; border: 1.5px solid var(--line); border-radius: 5px; background: var(--celeste-chiaro); overflow: hidden; }
.vbar i { display: block; height: 100%; width: 0; background: var(--blu); }

/* ---------- listino, nave, mercante ---------- */
.seg { display: inline-grid; grid-auto-flow: column; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; justify-self: start; }
.seg button { padding: 9px 16px; min-height: 44px; border: 0; background: var(--celeste); font-weight: 800; font-size: 17.5px; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--giallino-2); }
.scrollrow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.pick { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; min-height: 44px; border: 2px solid var(--line); border-radius: 999px; background: var(--celeste); font-weight: 700; font-size: 17px; white-space: nowrap; }
.pick .ic { width: 26px; height: 26px; }
.pick.on { background: var(--giallino-2); }
.pick.plain { padding-left: 12px; }
.box { background: var(--celeste); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.box h2, .box h3 { margin: 0; font-family: var(--f-disp); }
.box h2 { font-size: 24px; }
.box h3 { font-size: 21px; }
.box p { margin: 0; }
.muted { color: var(--ink-2); font-size: 17px; }
.tablewrap { overflow-x: auto; border: 2px solid var(--line); border-radius: var(--r); background: var(--celeste); }
.lt { width: 100%; border-collapse: collapse; font-size: 18px; }
.lt th { background: var(--line); color: var(--celeste); font-size: 14.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; text-align: right; padding: 8px 10px; white-space: nowrap; }
.lt th:first-child, .lt td:first-child { text-align: left; }
.lt td { padding: 9px 10px; border-top: 1px solid rgba(43, 58, 48, .2); text-align: right; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.lt td.cn { font-weight: 700; white-space: normal; }
.lt td.cn small { display: block; font-weight: 500; font-size: 14px; color: var(--ink-3); letter-spacing: .04em; }
.lt tr.here td { background: #e9f4fb; }
.lt tr.best td { background: var(--giallino); }
.lt td .gn { display: inline-flex; align-items: center; gap: 6px; }
.lt td .gn .ic { width: 26px; height: 26px; }
.lt td.strong { font-weight: 800; }
.lt td.unk { color: var(--ink-3); }
.shiphead { display: flex; align-items: center; gap: 12px; }
.shiphead .ic { width: 44px; height: 44px; color: var(--blu); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { background: var(--celeste-chiaro); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 1px; }
.stat span { font-size: 14px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.stat b { font-size: 21px; font-variant-numeric: lining-nums tabular-nums; }
.yard { display: grid; gap: 10px; }
.yship { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; background: var(--celeste-chiaro); border: 1.5px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.yship.cur { background: var(--giallino); }
.yship h4 { margin: 0; font-size: 19px; }
.yship p { margin: 0; font-size: 16.5px; color: var(--ink-2); }
.yship .btn { grid-column: 2; grid-row: 1 / span 2; }
@media (max-width: 520px) {
  .yship { grid-template-columns: 1fr; }
  .yship .btn { grid-column: 1; grid-row: auto; justify-self: start; }
}
.rankname { font-family: var(--f-disp); font-size: 28px; color: var(--porpora); line-height: 1.1; }
.pbar { height: 12px; border: 2px solid var(--line); border-radius: 7px; background: var(--celeste-chiaro); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--porpora); }
.ladder { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.ladder li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 7px; font-size: 17.5px; }
.ladder li.done { color: var(--ink); }
.ladder li.todo { color: var(--ink-3); }
.ladder li.cur { background: var(--giallino); font-weight: 800; border: 1.5px solid var(--line); }
.diary { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; }
.diary li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(43, 58, 48, .18); font-size: 17px; }
.diary li:first-child { border-top: 0; }
.diary .ic { width: 20px; height: 20px; color: var(--ink-3); margin-top: 1px; }
.diary li.d-news .ic { color: var(--porpora); }
.diary li.d-news span { color: var(--ink); }
.diary li.d-rank .ic { color: #9c7a24; }
.diary li.d-rank span { font-weight: 700; }
.diary time { display: block; font-size: 14.5px; color: var(--ink-3); }
.cargo-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.cargo-list li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--giallino); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.cargo-list .ic { width: 30px; height: 30px; }
.cargo-list small { display: block; color: var(--ink-2); font-size: 15.5px; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- finestre e avvisi ---------- */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(29, 41, 34, .5); display: grid; place-items: center; padding-inline: 16px; padding-block: 16px; }
.modal .card { width: min(560px, 100%); max-height: min(86vh, 900px); overflow: auto; background: var(--verdino); border: 2px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.modal h2 { margin: 0; font-family: var(--f-disp); font-size: 27px; color: var(--porpora); }
.modal h3 { margin: 6px 0 0; font-size: 19px; }
.modal p { margin: 0; }
.modal .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.rankseal { justify-self: center; width: 84px; height: 84px; border-radius: 50%; background: var(--porpora); color: var(--giallino); display: grid; place-items: center; border: 3px solid var(--line); box-shadow: inset 0 0 0 4px #b24a3c; }
.rankseal .ic { width: 44px; height: 44px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--navH) + env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);
  z-index: 70;
  width: max-content;
  max-width: min(92vw, 560px);
  background: var(--ink);
  color: var(--giallino);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 18px;
  box-shadow: var(--shadow);
  animation: toastIn .18s ease-out;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

@media (max-width: 520px) {
  body { font-size: 18px; }
  .where { font-size: 22px; }
  .purse { font-size: 21px; }
  .trow { padding-inline: 6px; gap: 4px; min-height: 50px; }
  .trow.thead { font-size: 11.5px; letter-spacing: .02em; }
  .tname { gap: 5px; font-size: 16.5px; }
  .tname .ic { width: 25px; height: 25px; }
  .tporto, .tmed { font-size: 15px; }
  .tstiva { font-size: 16.5px; }
  .pbtn { height: 40px; font-size: 17.5px; }
  .trade-h h2 { font-size: 24px; }
  .qb { min-width: 50px; padding: 0 10px; }
  .lt { font-size: 17px; }
  .lt th, .lt td { padding-inline: 7px; }
}
@media (max-width: 400px) {
  .qlbl { display: none; }
}
@media (max-width: 374px) {
  .tname .ic { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

<script>
/* Fondaco — motore del gioco (economia, viaggi, eventi). Nessuna dipendenza. */
const FondacoEngine = (() => {
  'use strict';

  const GOODS = [
    { id: 'grano',     n: 'Grano',         s: 'Grano',     u: ['salma', 'salme'],     p: 10,  d: 120 },
    { id: 'sale',      n: 'Sale',          s: 'Sale',      u: ['sacco', 'sacchi'],    p: 7,   d: 110 },
    { id: 'legname',   n: 'Legname',       s: 'Legname',   u: ['catasta', 'cataste'], p: 13,  d: 90 },
    { id: 'pesce',     n: 'Pesce salato',  s: 'Pesce',     u: ['barile', 'barili'],   p: 17,  d: 80 },
    { id: 'vino',      n: 'Vino',          s: 'Vino',      u: ['botte', 'botti'],     p: 20,  d: 90 },
    { id: 'olio',      n: 'Olio',          s: 'Olio',      u: ['giara', 'giare'],     p: 28,  d: 80 },
    { id: 'formaggio', n: 'Formaggio',     s: 'Formaggio', u: ['forma', 'forme'],     p: 24,  d: 70 },
    { id: 'lana',      n: 'Lana',          s: 'Lana',      u: ['balla', 'balle'],     p: 32,  d: 70 },
    { id: 'cuoio',     n: 'Cuoio',         s: 'Cuoio',     u: ['fascio', 'fasci'],    p: 38,  d: 60 },
    { id: 'ferro',     n: 'Ferro',         s: 'Ferro',     u: ['cantàro', 'cantàri'], p: 46,  d: 60 },
    { id: 'cotone',    n: 'Cotone',        s: 'Cotone',    u: ['balla', 'balle'],     p: 52,  d: 55 },
    { id: 'cera',      n: 'Cera',          s: 'Cera',      u: ['pane', 'pani'],       p: 60,  d: 45 },
    { id: 'allume',    n: 'Allume',        s: 'Allume',    u: ['sacco', 'sacchi'],    p: 68,  d: 45 },
    { id: 'panni',     n: 'Panni di lana', s: 'Panni',     u: ['pezza', 'pezze'],     p: 92,  d: 45 },
    { id: 'vetro',     n: 'Vetro',         s: 'Vetro',     u: ['cassa', 'casse'],     p: 105, d: 35 },
    { id: 'zucchero',  n: 'Zucchero',      s: 'Zucchero',  u: ['pane', 'pani'],       p: 125, d: 35 },
    { id: 'seta',      n: 'Seta',          s: 'Seta',      u: ['balla', 'balle'],     p: 180, d: 25 },
    { id: 'spezie',    n: 'Spezie',        s: 'Spezie',    u: ['sacco', 'sacchi'],    p: 230, d: 22 },
  ];
  const GI = Object.fromEntries(GOODS.map((g, i) => [g.id, i]));

  const CITIES = [
    { id: 'barcellona', size: 1.0, yard: true,  P: ['lana', 'ferro'], N: ['cotone', 'vetro', 'zucchero', 'seta', 'spezie'],
      d: "Porto del re d'Aragona. Lana delle montagne e ferro delle fucine catalane." },
    { id: 'marsiglia', size: 0.9, yard: false, P: ['vino', 'sale'], N: ['pesce', 'cuoio', 'cera', 'allume', 'seta'],
      d: 'Porto di Provenza, sulla via dei pellegrini. Vino delle colline e sale delle paludi.' },
    { id: 'genova', size: 1.3, yard: true, P: ['legname', 'panni'], N: ['grano', 'lana', 'formaggio', 'allume', 'zucchero', 'spezie'],
      d: 'Città di armatori e di banchieri. Panni e legname dei monti liguri, e sempre fame di grano.' },
    { id: 'pisa', size: 1.0, yard: false, P: ['ferro', 'cuoio', 'panni'], N: ['grano', 'sale', 'formaggio', 'lana', 'seta'],
      d: "Porto Pisano, alla foce dell'Arno. Ferro dell'Elba, cuoio delle concerie, panni." },
    { id: 'venezia', size: 1.4, yard: true, P: ['sale', 'vetro'], N: ['grano', 'vino', 'olio', 'cotone', 'allume', 'spezie'],
      d: 'La città sulla laguna. Vetro di Murano e sale di Chioggia, e un mercato che compra tutto.' },
    { id: 'cagliari', size: 0.6, yard: false, P: ['grano', 'sale', 'formaggio'], N: ['vino', 'olio', 'ferro', 'panni'],
      d: 'Castello pisano sul golfo. Grano, sale e formaggio di Sardegna.' },
    { id: 'tunisi', size: 1.0, yard: false, P: ['olio', 'lana', 'cuoio', 'cera'], N: ['grano', 'legname', 'ferro', 'panni'],
      d: 'Capitale di Ifriqiya. Olio, lana, cuoio e cera; il grano di Sicilia qui è di casa.' },
    { id: 'trapani', size: 0.7, yard: false, P: ['sale', 'pesce'], N: ['legname', 'olio', 'panni'],
      d: 'Saline e tonnare sulla punta occidentale della Sicilia.' },
    { id: 'palermo', size: 1.3, yard: true, P: ['grano', 'cotone', 'zucchero'], N: ['legname', 'ferro', 'cera', 'panni'],
      d: 'Corte di Federico II. Grano delle campagne, cotone e zucchero di canna.' },
    { id: 'messina', size: 1.0, yard: true, P: ['legname', 'vino', 'seta'], N: ['grano', 'sale', 'olio', 'cuoio'],
      d: 'La città dello Stretto. Seta, vino e legname dei boschi di Calabria.' },
    { id: 'napoli', size: 1.1, yard: false, P: ['vino', 'olio'], N: ['grano', 'sale', 'pesce', 'cera', 'vetro'],
      d: 'Città del Regno, sul golfo. Vino e olio di Campania.' },
    { id: 'bari', size: 0.8, yard: false, P: ['grano', 'olio'], N: ['sale', 'pesce', 'ferro', 'panni'],
      d: 'Porto di Puglia e di San Nicola. Olio e grano delle terre piane.' },
    { id: 'candia', size: 0.7, yard: false, P: ['vino', 'formaggio', 'cera'], N: ['grano', 'sale', 'legname', 'cuoio'],
      d: 'Creta veneziana. Malvasia, formaggio e cera delle api di montagna.' },
    { id: 'costantinopoli', size: 1.5, yard: false, P: ['pesce', 'allume', 'seta'], N: ['vino', 'olio', 'panni', 'vetro', 'zucchero'],
      d: 'La città delle città, sul Bosforo. Seta, allume e pesce del Mar Nero.' },
    { id: 'alessandria', size: 1.4, yard: false, P: ['allume', 'zucchero', 'spezie'], N: ['legname', 'ferro', 'olio', 'formaggio', 'panni'],
      d: "Porta d'Egitto. Spezie dalle Indie, zucchero e allume. Senza legname e ferro l'Egitto non arma navi." },
    { id: 'acri', size: 0.9, yard: false, P: ['cotone', 'vetro', 'spezie'], N: ['grano', 'legname', 'ferro', 'vino'],
      d: 'Porto del Regno di Gerusalemme. Spezie di Damasco, cotone di Siria, vetro di Tiro.' },
  ];
  const CI = Object.fromEntries(CITIES.map((c, i) => [c.id, i]));

  const SHIPS = [
    { id: 'barca',  n: 'Barca',       cap: 45,  spd: 100, upk: 4,  cost: 3000,  d: 'Piccola e svelta. Porta poco, costa poco.' },
    { id: 'tarida', n: 'Tarida',      cap: 80,  spd: 88,  upk: 8,  cost: 6000,  d: 'La nave da carico dei porti siciliani.' },
    { id: 'cocca',  n: 'Cocca',       cap: 140, spd: 82,  upk: 14, cost: 14000, d: 'Scafo tondo e vela quadra. Capiente e sicura.' },
    { id: 'galea',  n: 'Galea',       cap: 90,  spd: 125, upk: 24, cost: 20000, d: 'Remi e vela: la più veloce del mare. I rematori si pagano.' },
    { id: 'nave',   n: 'Nave grossa', cap: 240, spd: 74,  upk: 24, cost: 30000, d: 'Due alberi e una stiva enorme: porta un magazzino intero, a passo lento.' },
  ];

  const RANKS = [
    { n: 'Garzone', p: 0 },
    { n: 'Mercante', p: 40 },
    { n: 'Mercante stimato', p: 150 },
    { n: 'Maestro di fondaco', p: 450 },
    { n: 'Console dei mercanti', p: 1200 },
    { n: 'Senatore', p: 3000 },
    { n: 'Pretore di Palermo', p: 8000 },
  ];

  const CFG = {
    ratioP: 1.9, ratioN: 0.5, ratio0: 1.0,
    curveA: 0.5, curveB: 1.5, curveK: 1.1, // prezzo = base × (A + B·e^(−K·scorte/equilibrio))
    k: 0.055,          // ritorno delle scorte verso l'equilibrio, al giorno
    spread0: 0.07, spreadRank: 0.004, spreadMin: 0.045,
    eventChance: 0.07,
    prestigePer: 15,   // tarì di guadagno per 1 punto di prestigio
    tradeIn: 0.6,
    loan: 1000, loanDue: 1200, loanShare: 0.25, loanBelow: 400,
    startMoney: 2000,
    startCity: 'palermo',
    startDate: [1230, 2, 1], // 1 marzo 1230 (mese 0-based)
  };

  let MAP = null; // { dist: {'a|b': nm}, routes: {'a|b': [[x,y]...]}, cities:[{id,x,y,px,py}] }
  let MC = null;  // punti della mappa nello stesso ordine di CITIES
  function init(map) {
    MAP = map;
    MC = CITIES.map(c => { const m = map.cities.find(x => x.id === c.id); if (!m) throw new Error('mappa senza ' + c.id); return m; });
  }

  // ---------- RNG ----------
  function rnd(st) { // mulberry32 sullo stato
    let t = (st.seed = (st.seed + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rint = (st, a, b) => a + Math.floor(rnd(st) * (b - a + 1));
  const pick = (st, arr) => arr[Math.floor(rnd(st) * arr.length)];
  function gauss(st) { let u = 0, v = 0; while (!u) u = rnd(st); v = rnd(st); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // ---------- mercato ----------
  const depth = (c, g) => GOODS[g].d * CITIES[c].size;
  function baseRatio(c, g) {
    const city = CITIES[c], id = GOODS[g].id;
    if (city.P.includes(id)) return CFG.ratioP;
    if (city.N.includes(id)) return CFG.ratioN;
    return CFG.ratio0;
  }
  function eventFactor(st, c, g) {
    let f = 1;
    for (const e of st.events) if (e.c === c && e.g.includes(g)) f *= e.f;
    return f;
  }
  function natural(st, c, g) { return depth(c, g) * baseRatio(c, g) * st.drift[c][g] * eventFactor(st, c, g); }
  function mid(c, g, S) {
    const r = Math.max(0, S) / depth(c, g);
    return GOODS[g].p * (CFG.curveA + CFG.curveB * Math.exp(-CFG.curveK * r));
  }
  function spread(st) { return Math.max(CFG.spreadMin, CFG.spread0 - CFG.spreadRank * rankIndex(st)); }
  const unitBuy = (st, c, g, S) => Math.max(1, Math.round(mid(c, g, S - 0.5) * (1 + spread(st))));
  const unitSell = (st, c, g, S) => Math.max(1, Math.round(mid(c, g, S + 0.5) * (1 - spread(st))));

  function buyPrice(st, c, g) { return unitBuy(st, c, g, st.stock[c][g]); }
  function sellPrice(st, c, g) { return unitSell(st, c, g, st.stock[c][g]); }
  function available(st, c, g) { return Math.max(0, Math.floor(st.stock[c][g])); }

  function cargoUsed(st) { return st.ship.cargo.reduce((a, x) => a + x.q, 0); }
  function capacity(st) { return SHIPS[st.ship.type].cap; }

  // Preventivo d'acquisto: quante unità, a che prezzo, con limite di prezzo e di quantità
  function quoteBuy(st, g, qty, limit) {
    const c = st.at; let S = st.stock[c][g];
    const room = capacity(st) - cargoUsed(st);
    let n = 0, total = 0, first = 0, last = 0, stop = '';
    const maxQ = Math.min(qty, room, Math.floor(S));
    while (n < qty) {
      if (n >= room) { stop = 'stiva'; break; }
      if (S < 1) { stop = 'scorte'; break; }
      const pr = unitBuy(st, c, g, S);
      if (limit && pr > limit) { stop = 'limite'; break; }
      if (total + pr > st.money) { stop = 'denaro'; break; }
      total += pr; if (!n) first = pr; last = pr; n++; S -= 1;
    }
    return { q: n, total, first, last, stop, maxQ };
  }
  function quoteSell(st, g, qty, limit) {
    const c = st.at; let S = st.stock[c][g];
    const hold = st.ship.cargo[g].q;
    let n = 0, total = 0, first = 0, last = 0, stop = '';
    while (n < qty) {
      if (n >= hold) { stop = 'stiva'; break; }
      const pr = unitSell(st, c, g, S);
      if (limit && pr < limit) { stop = 'limite'; break; }
      total += pr; if (!n) first = pr; last = pr; n++; S += 1;
    }
    const avg = hold ? st.ship.cargo[g].cost / hold : 0;
    return { q: n, total, first, last, stop, profit: Math.round(total - avg * n) };
  }

  function buy(st, g, qty, limit) {
    if (st.voyage) return { q: 0 };
    const qt = quoteBuy(st, g, qty, limit);
    if (!qt.q) return qt;
    const c = st.at;
    st.stock[c][g] -= qt.q;
    st.money -= qt.total;
    st.ship.cargo[g].q += qt.q; st.ship.cargo[g].cost += qt.total;
    st.stats.trades++;
    log(st, 'trade', `Comprate ${qt.q} ${unit(g, qt.q)} di ${GOODS[g].n.toLowerCase()} a ${cityName(c)} per ${fmt(qt.total)} tarì.`);
    remember(st, c);
    return qt;
  }
  function sell(st, g, qty, limit) {
    if (st.voyage) return { q: 0 };
    const qt = quoteSell(st, g, qty, limit);
    if (!qt.q) return qt;
    const c = st.at, cg = st.ship.cargo[g];
    const avg = cg.q ? cg.cost / cg.q : 0;
    st.stock[c][g] += qt.q;
    st.money += qt.total;
    qt.toBank = 0;
    if (st.debt > 0) {
      qt.toBank = Math.min(st.debt, Math.round(qt.total * CFG.loanShare));
      st.money -= qt.toBank; st.debt -= qt.toBank;
      if (!st.debt) log(st, 'ship', 'Debito col banco saldato: la cassa è di nuovo tutta tua.');
    }
    cg.cost = Math.max(0, cg.cost - avg * qt.q); cg.q -= qt.q; if (!cg.q) cg.cost = 0;
    st.stats.trades++;
    const profit = qt.profit;
    let pr = '';
    if (profit > 0) {
      st.stats.profit += profit;
      const before = rankIndex(st);
      st.prestige += profit / CFG.prestigePer;
      if (!st.stats.best || profit > st.stats.best.v) st.stats.best = { v: profit, g, c, day: st.day };
      pr = `, guadagno ${fmt(profit)}`;
      checkRank(st, before);
    } else if (profit < 0) { st.stats.loss += -profit; pr = `, perdita ${fmt(-profit)}`; }
    log(st, 'trade', `Vendute ${qt.q} ${unit(g, qt.q)} di ${GOODS[g].n.toLowerCase()} a ${cityName(c)} per ${fmt(qt.total)} tarì${pr}.`);
    remember(st, c);
    return qt;
  }

  function checkRank(st, before) {
    const now = rankIndex(st);
    if (now > before) {
      log(st, 'rank', `Nuovo grado: ${RANKS[now].n}. Nei fondachi ti fanno prezzi migliori.`);
      st.flash = { kind: 'rank', rank: now };
    }
  }
  function rankIndex(st) { let r = 0; RANKS.forEach((x, i) => { if (st.prestige >= x.p) r = i; }); return r; }

  // ---------- memoria dei prezzi ----------
  function remember(st, c) {
    st.known[c] = {
      day: st.day,
      b: GOODS.map((_, g) => available(st, c, g) ? buyPrice(st, c, g) : null),
      s: GOODS.map((_, g) => sellPrice(st, c, g)),
      a: GOODS.map((_, g) => available(st, c, g)),
    };
  }

  // ---------- calendario ----------
  const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  function dateOf(day) {
    const d = new Date(Date.UTC(CFG.startDate[0], CFG.startDate[1], CFG.startDate[2]));
    d.setUTCDate(d.getUTCDate() + day);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() };
  }
  function dateText(day) { const t = dateOf(day); return `${t.d} ${MESI[t.m]} ${t.y}`; }
  function isWinter(day) { const m = dateOf(day).m; return m === 11 || m === 0 || m === 1; }
  function season(day) { const m = dateOf(day).m; return m >= 2 && m <= 4 ? 'primavera' : m >= 5 && m <= 7 ? 'estate' : m >= 8 && m <= 10 ? 'autunno' : 'inverno'; }

  // ---------- viaggi ----------
  function distance(a, b) {
    if (a === b) return 0;
    const A = CITIES[a].id, B = CITIES[b].id;
    return MAP.dist[A + '|' + B] ?? MAP.dist[B + '|' + A];
  }
  function route(a, b) {
    const A = CITIES[a].id, B = CITIES[b].id;
    const r = MAP.routes[A + '|' + B];
    return r ? r.slice() : MAP.routes[B + '|' + A].slice().reverse();
  }
  function point(c) { return MC[c]; }
  function speed(st, day) { return SHIPS[st.ship.type].spd * (isWinter(day ?? st.day) ? 0.8 : 1); }
  function travelDays(st, to, from) { const nm = distance(from ?? st.at, to); return Math.max(1, Math.ceil(nm / speed(st))); }

  // Salpa: calcola il viaggio e fa passare i giorni. Restituisce il resoconto per l'animazione.
  function sail(st, to) {
    const from = st.at;
    if (to === from || st.voyage) return null;
    let days = travelDays(st, to);
    const nm = distance(from, to);
    const notes = [];
    const r = rnd(st);
    if (r < 0.14) { const extra = rnd(st) < 0.7 ? 1 : 2; days += extra; notes.push(`Vento contrario: ${extra === 1 ? 'un giorno' : 'due giorni'} in più di mare.`); }
    else if (r > 0.9 && days > 1) { days -= 1; notes.push('Vento in poppa: si arriva un giorno prima.'); }
    st.voyage = { from, to, days, left: days, nm };
    log(st, 'travel', `Salpata da ${cityName(from)} per ${cityName(to)}: ${nm} miglia, ${days} ${days === 1 ? 'giorno' : 'giorni'}.`);
    notes.forEach(t => log(st, 'travel', t));
    st.stats.voyages++; st.stats.miles += nm;
    const dayNews = [];
    for (let i = 0; i < days; i++) dayNews.push(advanceDay(st));
    st.at = to; st.voyage = null;
    log(st, 'travel', `Arrivata a ${cityName(to)} il ${dateText(st.day)}.`);
    remember(st, to);
    return { from, to, days, nm, notes, dayNews };
  }

  function wait(st) { // un giorno in porto
    if (st.voyage) return null;
    const n = advanceDay(st); remember(st, st.at); return n;
  }

  // ---------- il giorno che passa ----------
  function advanceDay(st) {
    st.day++;
    const news = [];
    // paga della ciurma
    const upk = SHIPS[st.ship.type].upk;
    if (st.money >= upk) { st.money -= upk; st.stats.upkeep += upk; }
    else {
      st.stats.upkeep += Math.max(0, st.money); st.money = 0;
      if (!st.unpaidWarned) { log(st, 'ship', 'La cassa è vuota: la ciurma lavora senza paga e borbotta.'); st.unpaidWarned = true; }
      st.prestige = Math.max(0, st.prestige - 0.5);
    }
    if (st.money >= upk) st.unpaidWarned = false;
    // eventi che scadono
    st.events = st.events.filter(e => {
      if (st.day >= e.end) { log(st, 'news', `A ${cityName(e.c)} ${e.over}`); return false; }
      return true;
    });
    // nuovi eventi
    if (rnd(st) < CFG.eventChance) { const e = newEvent(st); if (e) news.push(e); }
    // deriva lenta e mercati
    for (let c = 0; c < CITIES.length; c++) {
      for (let g = 0; g < GOODS.length; g++) {
        let dr = st.drift[c][g] * Math.exp(0.035 * gauss(st));
        dr = 1 + (dr - 1) * 0.97; // torna verso 1
        st.drift[c][g] = Math.min(1.35, Math.max(0.72, dr));
        const N = natural(st, c, g);
        let S = st.stock[c][g];
        S += CFG.k * (N - S) + 0.02 * depth(c, g) * gauss(st) * 0.5;
        st.stock[c][g] = Math.max(0, S);
      }
    }
    return news;
  }

  const EVENTS = [
    { id: 'carestia', w: 3, cities: c => !CITIES[c].P.includes('grano'), goods: () => ['grano'], f: 0.3, dur: [30, 50],
      t: (c) => `Carestia a ${cityName(c)}: il grano non basta e i prezzi salgono.`, over: 'la carestia è finita.' },
    { id: 'raccolto', w: 2, cities: c => CITIES[c].P.includes('grano'), goods: () => ['grano'], f: 1.7, dur: [25, 40],
      t: (c) => `Raccolto abbondante a ${cityName(c)}: il grano costa poco.`, over: 'il grano del raccolto è finito nei granai.' },
    { id: 'fiera', w: 3, cities: c => CITIES[c].size >= 1.0, goods: () => ['seta', 'spezie', 'zucchero', 'vetro'], f: 0.5, dur: [15, 25],
      t: (c) => `Fiera a ${cityName(c)}: si cercano seta, spezie, zucchero e vetro.`, over: 'la fiera ha chiuso i banchi.' },
    { id: 'armi', w: 2, cities: c => ['genova', 'pisa', 'venezia', 'barcellona', 'costantinopoli', 'acri'].includes(CITIES[c].id), goods: () => ['ferro', 'legname'], f: 0.35, dur: [25, 40],
      t: (c) => `${cityName(c)} arma le galee: servono ferro e legname.`, over: 'le galee sono armate e in mare.' },
    { id: 'naufragio', w: 2, cities: () => true, goods: (st, c) => [pick(st, ['cotone', 'cera', 'allume', 'panni', 'vetro', 'zucchero', 'seta', 'spezie'].filter(x => !CITIES[c].P.includes(x)))], f: 0.45, dur: [15, 30],
      t: (c, g) => `Una nave carica di ${GOODS[GI[g[0]]].n.toLowerCase()} è affondata davanti a ${cityName(c)}.`, over: 'il mercato ha dimenticato il naufragio.' },
    { id: 'festa', w: 3, cities: () => true, goods: () => ['vino', 'formaggio', 'cera'], f: 0.5, dur: [8, 14],
      t: (c) => `Festa del santo patrono a ${cityName(c)}: vino, formaggio e cera vanno a ruba.`, over: 'la festa è passata.' },
    { id: 'tonnara', w: 1, cities: c => CITIES[c].id === 'trapani', goods: () => ['pesce'], f: 1.8, dur: [20, 30],
      t: () => 'Tonnara ricca a Trapani: il pesce salato abbonda.', over: 'la mattanza è finita.' },
    { id: 'vendemmia', w: 1, cities: c => CITIES[c].P.includes('vino'), goods: () => ['vino'], f: 0.5, dur: [30, 45],
      t: (c) => `Vendemmia scarsa a ${cityName(c)}: il vino manca.`, over: 'il vino nuovo è arrivato.' },
    { id: 'carovana', w: 2, cities: c => ['alessandria', 'acri'].includes(CITIES[c].id), goods: () => ['spezie'], f: 1.8, dur: [20, 30],
      t: (c) => `Una carovana dall'Oriente è arrivata ad ${cityName(c)}: le spezie abbondano.`, over: 'le spezie della carovana sono vendute.' },
  ];
  function newEvent(st) {
    const tot = EVENTS.reduce((a, e) => a + e.w, 0);
    let r = rnd(st) * tot, E = EVENTS[0];
    for (const e of EVENTS) { r -= e.w; if (r <= 0) { E = e; break; } }
    const cands = CITIES.map((_, i) => i).filter(c => E.cities(c) && !st.events.some(e => e.c === c));
    if (!cands.length) return null;
    const c = pick(st, cands);
    const gids = E.goods(st, c).filter(Boolean);
    if (!gids.length) return null;
    const g = gids.map(x => GI[x]);
    const dur = rint(st, E.dur[0], E.dur[1]);
    // scossa immediata sulle scorte
    for (const gi of g) st.stock[c][gi] *= Math.pow(E.f, 0.5);
    const txt = E.t(c, gids);
    st.events.push({ id: E.id, c, g, f: E.f, end: st.day + dur, over: E.over, txt });
    log(st, 'news', txt);
    return txt;
  }

  // ---------- navi ----------
  function shipValue(st) { return Math.round(SHIPS[st.ship.type].cost * CFG.tradeIn); }
  function shipQuote(st, t) {
    const net = SHIPS[t].cost - shipValue(st);
    const fits = cargoUsed(st) <= SHIPS[t].cap;
    return { net, fits, can: t !== st.ship.type && fits && st.money >= net && CITIES[st.at].yard && !st.voyage };
  }
  function buyShip(st, t) {
    const q = shipQuote(st, t); if (!q.can) return false;
    const old = SHIPS[st.ship.type].n;
    st.money -= q.net;
    const before = rankIndex(st);
    if (SHIPS[t].cost > SHIPS[st.ship.type].cost) st.prestige += (SHIPS[t].cost - SHIPS[st.ship.type].cost) / 150;
    st.ship.type = t;
    log(st, 'ship', `Al cantiere di ${cityName(st.at)}: venduta la ${old.toLowerCase()}, comprata una ${SHIPS[t].n.toLowerCase()}. Spesa netta ${fmt(q.net)} tarì.`);
    checkRank(st, before);
    return true;
  }

  // ---------- banco ----------
  function canBorrow(st) { return !st.voyage && !(st.debt > 0) && st.money < CFG.loanBelow; }
  function borrow(st) {
    if (!canBorrow(st)) return false;
    st.money += CFG.loan; st.debt = CFG.loanDue; st.stats.loans = (st.stats.loans || 0) + 1;
    log(st, 'ship', `Un banchiere genovese ti presta ${fmt(CFG.loan)} tarì. Ne restituirai ${fmt(CFG.loanDue)}: un quarto di ogni vendita va al banco finché il debito è saldato.`);
    return true;
  }
  function repay(st) {
    const d = st.debt || 0;
    if (!d || st.money < d) return false;
    st.money -= d; st.debt = 0;
    log(st, 'ship', `Restituiti ${fmt(d)} tarì al banco. Debito saldato.`);
    return true;
  }

  // ---------- partita ----------
  function newGame(opts = {}) {
    const st = {
      v: 1, seed: (opts.seed ?? (Date.now() & 0x7fffffff)) | 0,
      name: (opts.name || 'Salvatore').trim().slice(0, 24),
      day: 0, money: CFG.startMoney, prestige: 0, debt: 0,
      at: CI[CFG.startCity], voyage: null,
      ship: { type: 0, name: (opts.ship || 'Santa Rosalia').trim().slice(0, 24), cargo: GOODS.map(() => ({ q: 0, cost: 0 })) },
      stock: [], drift: [], events: [], known: {}, log: [],
      stats: { trades: 0, voyages: 0, miles: 0, profit: 0, loss: 0, upkeep: 0, best: null },
    };
    for (let c = 0; c < CITIES.length; c++) {
      st.drift.push(GOODS.map(() => Math.exp(0.08 * gauss(st))));
      st.stock.push(GOODS.map((_, g) => depth(c, g) * baseRatio(c, g) * (0.8 + 0.4 * rnd(st))));
    }
    // alcuni giorni di assestamento
    for (let i = 0; i < 10; i++) { advanceDay(st); }
    st.day = 0; st.money = CFG.startMoney; st.stats.upkeep = 0; st.log = []; st.prestige = 0;
    st.events.forEach(e => { e.end -= 10; });
    st.events = st.events.filter(e => e.end > 0);
    remember(st, st.at);
    log(st, 'travel', `${dateText(0)}. ${st.name} apre il suo commercio a Palermo con una barca, la ${st.ship.name}, e ${fmt(CFG.startMoney)} tarì.`);
    st.events.forEach(e => log(st, 'news', e.txt));
    return st;
  }

  // ---------- utilità ----------
  function log(st, t, txt) { st.log.unshift({ d: st.day, t, txt }); if (st.log.length > 120) st.log.length = 120; }
  function cityName(c) { return MC ? MC[c].name : CITIES[c].id; }
  function unit(g, q) { return GOODS[g].u[q === 1 ? 0 : 1]; }
  function fmt(n) { return Math.round(n).toLocaleString('it-IT'); }
  function cargoValue(st) { return st.ship.cargo.reduce((a, x) => a + x.cost, 0); }
  function netWorth(st) { return st.money + shipValue(st) + cargoValue(st) - (st.debt || 0); }

  return {
    GOODS, CITIES, SHIPS, RANKS, CFG, GI, CI, MESI,
    init, newGame, buy, sell, quoteBuy, quoteSell, buyPrice, sellPrice, available,
    cargoUsed, capacity, sail, wait, travelDays, distance, route, speed, isWinter, season,
    dateText, dateOf, rankIndex, netWorth, shipValue, shipQuote, buyShip, cargoValue, spread,
    remember, fmt, unit, cityName, point, canBorrow, borrow, repay, advanceDay, mid, depth, natural, baseRatio,
  };
})();
if (typeof module !== 'undefined') module.exports = FondacoEngine;

<script>
(() => {
  'use strict';
  const E = FondacoEngine;
  const M = FONDACO_MAP;
  E.init(M);
  const G = E.GOODS, C = E.CITIES, SH = E.SHIPS, RK = E.RANKS;
  const NC = C.length, NG = G.length;
  const RAD = Math.PI / 180;
  const SAVE_KEY = 'fondaco.partita.v1';
  const PRIVACY = window.FONDACO_PRIVACY || 'https://salvatore2026.github.io/fondaco/privacy.html';
  const VERSION = window.FONDACO_VERSION || '1.0.0';

  let ST = null;
  let TAB = 'mercato';
  const TRADE = { qty: '5', lim: '' };
  const LIS = { mode: 'merce', g: 0, c: -1, sort: 'vendi' };
  let mapSel = -1;
  let busy = false;
  let lastMoney = null, flashT = 0, toastT = 0;
  const V = { x: 0, y: 0, k: 1, init: false };

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const fmt = n => Math.round(n).toLocaleString('it-IT');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const gicon = g => icon('g-' + G[g].id);
  const cname = c => E.cityName(c);
  const proj = (lon, lat) => [(lon - M.proj.lon0) * RAD * M.proj.cos * M.proj.k, (M.proj.lat1 - lat) * RAD * M.proj.k];
  const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const giorni = n => `${n} ${n === 1 ? 'giorno' : 'giorni'}`;
  function ago(day) { const d = ST.day - day; return d <= 0 ? 'oggi' : d === 1 ? 'ieri' : `${d} giorni fa`; }
  function sizeLabel(s) { return s >= 1.3 ? 'grande città' : s >= 0.95 ? 'città' : 'piccolo porto'; }

  // ---------- salvataggio ----------
  function valid(st) {
    return st && st.v === 1 && Array.isArray(st.stock) && st.stock.length === NC && st.ship && Array.isArray(st.ship.cargo) && st.ship.cargo.length === NG;
  }
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(ST)); } catch (e) { /* senza memoria si gioca lo stesso */ } }
  function load() { try { const s = localStorage.getItem(SAVE_KEY); const st = s ? JSON.parse(s) : null; return valid(st) ? st : null; } catch (e) { return null; } }

  // ---------- avvisi ----------
  function toast(msg, ms = 3200) {
    const t = $('#toast');
    t.innerHTML = msg; t.hidden = false;
    t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
  }
  function openModal(html) {
    $('#modal-card').innerHTML = html;
    $('#modal').hidden = false;
    const f = $('#modal-card button'); if (f) f.focus();
  }
  function closeModal() { $('#modal').hidden = true; $('#modal-card').innerHTML = ''; }
  $('#modal').addEventListener('click', e => {
    if (e.target.id === 'modal') { closeModal(); return; }
    const b = e.target.closest('[data-m]'); if (!b) return;
    const a = b.dataset.m;
    if (a === 'close') closeModal();
    else if (a === 'restart') { closeModal(); ST = null; showTitle(); }
    else if (a === 'newgame') { closeModal(); startNew(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

  function helpHTML() {
    return `<h2 id="modal-title">Come si gioca</h2>
      <h3>Il mercato</h3>
      <p>Ogni porto ha le sue merci. Nella colonna <b>Compra</b> leggi quanto ti chiede la città, in <b>Vendi</b> quanto ti paga. Scegli la quantità nella barra in basso, 1, 5, 50 o Max, e tocca il prezzo: la nave compra o vende subito. Ogni unità comprata fa salire un poco il prezzo della successiva, ogni unità venduta lo fa scendere. In <b>Media</b> trovi quanto hai pagato in media la merce che hai nella stiva.</p>
      <h3>Il prezzo massimo</h3>
      <p>Sopra la griglia puoi scrivere quanto sei disposto a pagare al massimo. La nave compra finché il prezzo resta entro quella cifra, poi si ferma. Lascia il campo vuoto e compra senza limite.</p>
      <h3>Il listino</h3>
      <p>Tocca il nome di una merce: si apre il listino con i prezzi che ricordi di ogni porto.</p>
      <h3>Il viaggio</h3>
      <p>Dalla mappa scegli un porto e salpa. Ogni giorno di mare paghi la ciurma. D'inverno le navi vanno più piano, e il vento a volte allunga il viaggio.</p>
      <h3>La memoria dei prezzi</h3>
      <p>Il listino ricorda i prezzi dei porti che hai visto, con i giorni passati da allora. Le scorte si rifanno col tempo: un porto dove hai venduto molto torna a pagare bene dopo qualche settimana.</p>
      <h3>Le notizie</h3>
      <p>Carestie, fiere, naufragi e feste cambiano i prezzi. Le leggi sulla scheda del porto e nel diario del mercante.</p>
      <h3>Il prestigio</h3>
      <p>Ogni guadagno porta prestigio. A ogni grado i mercanti ti fanno prezzi migliori. Nei cantieri di Palermo, Messina, Genova, Venezia e Barcellona compri navi più grandi.</p>

  // ---------- disegno generale ----------
  function render() { renderTop(); renderNav(); renderView(); }

    const m = ST.money, el = $('#t-money');

      el.classList.remove('flash-up', 'flash-down'); void el.offsetWidth;
      el.classList.add(m > lastMoney ? 'flash-up' : 'flash-down');
      clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove('flash-up', 'flash-down'), 900);
    }

    el.textContent = fmt(m);
    const used = E.cargoUsed(ST), cap = E.capacity(ST);
    $('#t-hold').textContent = `${used}/${cap}`;
    $('#t-holdbar').style.width = Math.min(100, 100 * used / cap) + '%';
  }
  function renderNav() {
    $$('#nav button').forEach(b => {
      if (b.dataset.tab === TAB) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');

  $('#nav').addEventListener('click', e => {

  function renderView() {

  // ---------- MERCATO: «Merci di scambio» ----------
  const chipG = g => `<span class="gchip">${gicon(g)}${G[g].s}</span>`;
  function specHTML(c) {
    const city = C[c];
    return `<div class="spec"><div><span class="lbl">Produce</span>${city.P.map(id => chipG(E.GI[id])).join('')}</div>
      <div><span class="lbl">Cerca</span>${city.N.map(id => chipG(E.GI[id])).join('')}</div></div>`;
  }
  const specLine = arr => arr.map(id => `<span class="sg">${gicon(E.GI[id])}${G[E.GI[id]].s.toLowerCase()}</span>`).join(' ');
  const newsHTML = c => ST.events.filter(e => e.c === c).map(e => `<p class="news">${icon('u-news')}<span>${esc(e.txt)}</span></p>`).join('');
  function viewMercato() {
    const c = ST.at;
    return `<section class="port">
        <div class="port-h"><h1>${esc(cname(c))}</h1><span class="tag">${sizeLabel(C[c].size)}${C[c].yard ? ' · cantiere' : ''}</span></div>

      </section>
      ${bankHTML()}
      <section class="trade" aria-label="Merci di scambio">
        <div class="trade-h">
          <h2>Merci di scambio</h2>

            <label class="lim" for="in-lim">Paga al massimo <input id="in-lim" class="inp num" type="number" inputmode="numeric" min="1" step="1" value="${TRADE.lim || ''}" placeholder="—"> tarì</label></div>

  function tradeRowsHTML() {

      ${G.map((_, g) => tradeRow(g)).join('')}`;
  }
  function tradeRow(g) {
    const c = ST.at, av = E.available(ST, c, g), h = ST.ship.cargo[g];
    const bp = av ? E.buyPrice(ST, c, g) : 0, sp = E.sellPrice(ST, c, g);
    const avg = h.q ? Math.round(h.cost / h.q) : 0;
    const sellCls = h.q ? (sp > avg ? ' up' : sp < avg ? ' down' : '') : '';
    return `<div class="trow${h.q ? ' has' : ''}" data-g="${g}">
        <button type="button" class="tname" data-act="goodinfo" data-g="${g}" title="Dove conviene: listino di ${esc(G[g].n.toLowerCase())}">${gicon(g)}<span>${G[g].s}</span></button>
        <span class="num tporto">${av ? fmt(av) : ''}</span>
        <button type="button" class="pbtn" data-act="tbuy" data-g="${g}"${av ? '' : ' aria-disabled="true"'} aria-label="Compra ${esc(G[g].n.toLowerCase())} a ${bp} tarì">${bp}</button>
        <button type="button" class="pbtn${sellCls}" data-act="tsell" data-g="${g}"${h.q ? '' : ' aria-disabled="true"'} aria-label="Vendi ${esc(G[g].n.toLowerCase())} a ${sp} tarì">${sp}</button>
        <span class="num tstiva">${h.q || ''}</span>
        <span class="num tmed">${h.q ? avg : ''}</span>
      </div>`;

  function bankHTML() {
    const L = E.CFG;
    if (ST.debt > 0) return `<div class="box bank"><p><b>Debito col banco: ${fmt(ST.debt)} tarì.</b> Un quarto di ogni vendita va a saldarlo.</p>
      <div class="row2"><button class="btn small" type="button" data-act="repay" ${ST.money >= ST.debt ? '' : 'disabled'}>${ST.money >= ST.debt ? `Salda ora ${fmt(ST.debt)} tarì` : `Per saldare ora servono ${fmt(ST.debt)} tarì`}</button></div></div>`;
    if (E.canBorrow(ST)) return `<div class="box bank"><p><b>La cassa è quasi vuota.</b> Un banchiere genovese presta ${fmt(L.loan)} tarì: ne restituisci ${fmt(L.loanDue)}, un quarto di ogni vendita finché il debito è saldato.</p>
      <div class="row2"><button class="btn small" type="button" data-act="borrow">Chiedi ${fmt(L.loan)} tarì al banco</button></div></div>`;
    return '';

  function refreshTrade(flashG) {
    const grid = $('#tgrid'); if (!grid) return;
    grid.innerHTML = tradeRowsHTML();
    const hold = $('#tr-hold'); if (hold) hold.textContent = `${E.cargoUsed(ST)}/${E.capacity(ST)}`;
    $$('.qb').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === TRADE.qty)));

  }
  function afterTrade(g) {
    if ($('.bank') || E.canBorrow(ST) || ST.debt > 0) { rerenderMarket(); const r = $(`.trow[data-g="${g}"]`); if (r) { r.classList.add('flash'); setTimeout(() => r.classList.remove('flash'), 700); } }

    return { stiva: 'la stiva è piena', scorte: 'il porto non ne ha più', limite: `il prezzo supera i ${lim} tarì che vuoi pagare al massimo`, denaro: 'non bastano i tarì' }[stop] || 'non si può';
  }
  const range = (a, b) => a === b ? `a ${a}` : `da ${a} a ${b}`;
  function tradeBuy(g) {
    if (busy) return;
    const qty = wantQty(), lim = +TRADE.lim || 0;
    const r = E.buy(ST, g, qty, lim);
    if (!r.q) { toast(`Non compri ${G[g].n.toLowerCase()}: ${whyBuy(r.stop, lim)}.`); return; }
    save(); renderTop(); afterTrade(g);
    let t = `Comprate ${r.q} ${E.unit(g, r.q)} di ${G[g].n.toLowerCase()} ${range(r.first, r.last)} tarì: −${fmt(r.total)}.`;
    if (r.q < qty && TRADE.qty !== 'max' && r.stop) t += ` Ti fermi a ${r.q}: ${whyBuy(r.stop, lim)}.`;
    else if (TRADE.qty === 'max' && r.stop) t += ` Ti fermi lì: ${whyBuy(r.stop, lim)}.`;
    toast(t, 3600);
    checkFlash();
  }
  function tradeSell(g) {
    if (busy) return;
    if (!ST.ship.cargo[g].q) { toast(`Nella stiva non hai ${G[g].n.toLowerCase()} da vendere.`); return; }
    const r = E.sell(ST, g, wantQty(), 0);
    if (!r.q) return;
    save(); renderTop(); afterTrade(g);
    toast(`Vendute ${r.q} ${E.unit(g, r.q)} di ${G[g].n.toLowerCase()} ${range(r.first, r.last)} tarì: +${fmt(r.total)}${r.profit > 0 ? `, guadagno ${fmt(r.profit)}` : r.profit < 0 ? `, perdita ${fmt(-r.profit)}` : ''}.${r.toBank ? ` Al banco ${fmt(r.toBank)}.` : ''}`, 3600);

      const last = f.rank === RK.length - 1;

        <h2 id="modal-title" style="text-align:center">${esc(RK[f.rank].n)}</h2>
        <p>${last ? `Palermo ti affida la città. Da oggi ${esc(ST.name)} è Pretore di Palermo, e il suo nome si legge nei fondachi da Barcellona ad Acri.` : `Il tuo nome comincia a girare per i porti. Da oggi sei ${esc(RK[f.rank].n)}: nei fondachi ti trattano con più riguardo, compri un poco meno caro e vendi un poco meglio.`}</p>
        <div class="acts"><button class="btn main" data-m="close" type="button">Avanti</button></div>`);

  // ---------- eventi del corpo ----------
  const view = $('#view');
  view.addEventListener('click', e => {
    if (busy && !e.target.closest('[data-act="skip"],[data-act="zin"],[data-act="zout"]')) return;
    const a = e.target.closest('[data-act]');
    if (a) { act(a.dataset.act, a); return; }
    const lp = e.target.closest('[data-lg]');
    if (lp) { LIS.g = +lp.dataset.lg; rerenderListino(); return; }

  });
  view.addEventListener('input', e => {
    if (e.target.id === 'in-lim') {
      const v = e.target.value.trim();
      TRADE.lim = (v === '' || !(+v > 0)) ? '' : String(Math.floor(+v));
    }
  });
  view.addEventListener('change', e => {
    if (e.target.id === 'in-shipname') {
      const v = e.target.value.trim();
      if (v) { ST.ship.name = v.slice(0, 24); save(); toast(`La nave ora si chiama ${esc(ST.ship.name)}.`); }
      else e.target.value = ST.ship.name;

  });
  view.addEventListener('keydown', e => {
    if (e.target.id === 'in-lim' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
