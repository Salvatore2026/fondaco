  function act(name, el) {
    switch (name) {
      case 'tbuy': if (el.getAttribute('aria-disabled') === 'true') toast(`Il porto non ha ${G[+el.dataset.g].n.toLowerCase()} da vendere.`); else tradeBuy(+el.dataset.g); break;
      case 'tsell': tradeSell(+el.dataset.g); break;
      case 'tqty': TRADE.qty = el.dataset.q; $$('.qb').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === TRADE.qty))); break;
      case 'goodinfo': LIS.mode = 'merce'; LIS.g = +el.dataset.g; TAB = 'listino'; window.scrollTo(0, 0); render(); break;
      case 'wait': {
        const news = E.wait(ST); save(); renderTop();
        rerenderMarket();
        toast(news && news.length ? `Un giorno in porto. ${esc(news[0])}` : `Un giorno in porto: ${E.dateText(ST.day)}.`, 3600);
        break;
      }
      case 'sail': startVoyage(+el.dataset.c); break;
      case 'close-sheet': mapSel = -1; drawMapState(); break;
      case 'goto-market': TAB = 'mercato'; render(); break;
      case 'city-listino': LIS.mode = 'porto'; LIS.c = +el.dataset.c; TAB = 'listino'; window.scrollTo(0, 0); render(); break;
      case 'lis-mode': LIS.mode = el.dataset.v; rerenderListino(); break;
      case 'lis-sort': LIS.sort = el.dataset.v; rerenderListino(); break;
      case 'buyship': {
        const t = +el.dataset.t;
        if (E.buyShip(ST, t)) { save(); renderTop(); $('#view').innerHTML = viewNave(); toast(`La ${esc(ST.ship.name)} ora è una ${SH[t].n.toLowerCase()} da ${SH[t].cap} carichi.`, 3800); checkFlash(); }
        break;
      }
      case 'help': openModal(helpHTML()); break;
      case 'borrow': if (E.borrow(ST)) { save(); renderTop(); rerenderMarket(); toast(`Il banco ti ha prestato ${fmt(E.CFG.loan)} tarì.`); } break;
      case 'repay': if (E.repay(ST)) { save(); renderTop(); rerenderMarket(); toast('Debito saldato.'); } break;
      case 'title': save(); showTitle(); break;
      case 'restart':
        openModal(`<h2 id="modal-title">Nuova partita?</h2><p>La partita in corso andrà perduta: tarì, nave, prestigio e diario.</p>
          <div class="acts"><button class="btn ghost" data-m="close" type="button">Annulla</button><button class="btn main" data-m="restart" type="button">Sì, ricomincia</button></div>`);
        break;
      case 'skip': skipVoyage = true; break;
      case 'zin': zoomBy(1.5); break;
      case 'zout': zoomBy(1 / 1.5); break;
      case 'zhome': homeView(true); break;
    }
  }

  // ---------- MAPPA ----------
  let mapEls = null, skipVoyage = false, hintSeen = false;
  function viewMappa() {
    return `<div class="mapwrap" id="mapwrap">
        <svg id="map" role="img" aria-label="Mappa del Mediterraneo con i porti"></svg>
        <p class="maphint" id="maphint">Tocca un porto per vedere il viaggio. Trascina per muovere, pizzica o usa + e − per ingrandire.</p>
        <div class="mapctl"><button type="button" data-act="zin" aria-label="Ingrandisci">+</button><button type="button" data-act="zout" aria-label="Rimpicciolisci">−</button><button type="button" data-act="zhome" aria-label="Torna alla nave">${icon('u-target')}</button></div>
        <div class="sheet" id="sheet" hidden></div>
        <div class="voyage" id="voyage" hidden></div>
      </div>`;
  }
  function setupMap() {
    const svg = $('#map');
    let s = `<defs><radialGradient id="redg" cx=".36" cy=".34" r=".78"><stop offset="0" stop-color="#ff9a86"/><stop offset=".42" stop-color="#e3261a"/><stop offset="1" stop-color="#7d120b"/></radialGradient></defs><g id="world">${mapBaseSVG()}<rect class="map-edge" x="0" y="0" width="${M.W}" height="${M.H}"/>`;
    s += SEA_LABELS.map(([t, lo, la, rot]) => { const [x, y] = proj(lo, la); return `<text class="sea-lbl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle"${rot ? ` transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})"` : ''}>${t}</text>`; }).join('');
    s += LAND_LABELS.map(([t, lo, la]) => { const [x, y] = proj(lo, la); return `<text class="land-lbl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${t}</text>`; }).join('');
    s += `<polyline id="routebg" class="routebg" points="" hidden/><polyline id="route" class="route" points="" hidden/><polyline id="wake" class="wake" points="" hidden/>`;
    s += `<g id="shipg"><use href="#u-ship" x="-14" y="-18" width="28" height="28"/></g>`;
    s += `<g id="cities">${C.map((cc, c) => {
      const p = E.point(c);
      const prod = cc.P.map((id, i) => `<use href="#g-${id}" x="${3 + i * 21}" y="2" width="19" height="19"/>`).join('');
      return `<g class="city" data-c="${c}"><circle class="hit" cx="${p.x}" cy="${p.y}" r="14"/><circle class="ring" cx="${p.x}" cy="${p.y}" r="10"/><circle class="dot" cx="${p.x}" cy="${p.y}" r="6"/><text class="cname" x="${p.x}" y="${p.y}">${esc(p.name)}</text><g class="prod" data-n="${cc.P.length}"><rect x="0" y="0" width="${cc.P.length * 21 + 4}" height="23" rx="6"/>${prod}</g></g>`;
    }).join('')}</g>`;
    s += `</g>`;
    svg.innerHTML = s;
    mapEls = { svg, world: $('#world'), wrap: $('#mapwrap'), route: $('#route'), routebg: $('#routebg'), wake: $('#wake'), ship: $('#shipg') };
    sizeMap();
    if (!V.init) homeView(false); else applyView();
    drawMapState();
    bindMap();
    if (!hintSeen) setTimeout(() => { hintSeen = true; const h = $('#maphint'); if (h && mapSel < 0) h.hidden = true; }, 7000);
  }
  function sizeMap() {
    const wrap = $('#mapwrap'); if (!wrap) return;
    const top = wrap.getBoundingClientRect().top;
    const navH = $('.nav').getBoundingClientRect().height;
    const h = Math.max(300, Math.floor(window.innerHeight - top - navH - 12));
    wrap.style.height = h + 'px';
    const r = wrap.getBoundingClientRect();
    V.cw = r.width; V.ch = r.height;
    mapEls.svg.setAttribute('viewBox', `0 0 ${V.cw} ${V.ch}`);
  }
  function kLimits() { const fit = Math.min(V.cw / M.W, V.ch / M.H); return [fit * 0.98, Math.max(V.cw / M.W, V.ch / M.H) * 7]; }
  function clampView() {
    const [kmin, kmax] = kLimits();
    V.k = Math.min(kmax, Math.max(kmin, V.k));
    // la carta si può spostare fin quasi a metà schermo oltre il bordo, così ogni porto arriva al centro
    const mw = M.W * V.k, mh = M.H * V.k, mx = V.cw * 0.45, my = V.ch * 0.45;
    V.x = Math.min(mx, Math.max(V.cw - mw - mx, V.x));
    V.y = Math.min(my, Math.max(V.ch - mh - my, V.y));
    if (mw + 2 * mx <= V.cw) V.x = (V.cw - mw) / 2;
    if (mh + 2 * my <= V.ch) V.y = (V.ch - mh) / 2;
  }
  function applyView() {
    if (!mapEls) return;
    clampView();
    mapEls.world.setAttribute('transform', `translate(${V.x.toFixed(2)} ${V.y.toFixed(2)}) scale(${V.k.toFixed(4)})`);
    mapEls.svg.style.setProperty('--z', V.k.toFixed(4));
    scaleMarks();
  }
  function scaleMarks() {
    const k = V.k;
    mapEls.svg.classList.toggle('far', k < 0.8);
    $$('#cities .city').forEach(g => {
      const c = +g.dataset.c, p = E.point(c);
      const here = c === ST.at && !busy;
      g.querySelector('.hit').setAttribute('r', (18 / k).toFixed(2));
      g.querySelector('.dot').setAttribute('r', ((here ? 8 : 6.5) / k).toFixed(2));
      g.querySelector('.ring').setAttribute('r', ((here ? 12.5 : 11) / k).toFixed(2));
      const t = g.querySelector('text'), pos = LBL_POS[C[c].id] || 'r';
      let dx = 11, dy = 5.5, anchor = 'start';
      if (pos === 'l') { dx = -11; anchor = 'end'; }
      if (pos === 'a') { dx = 0; dy = -12; anchor = 'middle'; }
      if (pos === 'b') { dx = 0; dy = 24; anchor = 'middle'; }
      t.setAttribute('x', (p.x + dx / k).toFixed(2)); t.setAttribute('y', (p.y + dy / k).toFixed(2)); t.setAttribute('text-anchor', anchor);
      // icone delle merci prodotte, in pixel dello schermo
      const pr = g.querySelector('.prod'), w = (+pr.dataset.n) * 21 + 4;
      let px, py;
      if (pos === 'r') { px = 11; py = 10; }
      else if (pos === 'l') { px = -11 - w; py = 10; }
      else if (pos === 'a') { px = -w / 2; py = 11; }
      else { px = -w / 2; py = 30; }
      pr.setAttribute('transform', `translate(${(p.x + px / k).toFixed(2)} ${(p.y + py / k).toFixed(2)}) scale(${(1 / k).toFixed(4)})`);
    });
    mapEls.routebg.setAttribute('stroke-width', (5.5 / k).toFixed(3));
    mapEls.route.setAttribute('stroke-width', (2.8 / k).toFixed(3));
    mapEls.wake.setAttribute('stroke-width', (3 / k).toFixed(3));
    mapEls.route.setAttribute('stroke-dasharray', `${(9 / k).toFixed(2)} ${(6 / k).toFixed(2)}`);
    placeShip(shipPos.x, shipPos.y, shipPos.flip);
  }
  const shipPos = { x: 0, y: 0, flip: false };
  function placeShip(x, y, flip) {
    shipPos.x = x; shipPos.y = y; shipPos.flip = flip;
    if (!mapEls) return;
    const s = 1.05 / V.k;
    mapEls.ship.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${(flip ? -s : s).toFixed(4)} ${s.toFixed(4)})`);
  }
  function homeView(anim) {
    const [kmin] = kLimits();
    const portrait = V.ch / M.H > V.cw / M.W;
    V.k = portrait ? V.ch / M.H : Math.max(kmin, V.cw / M.W * 1.15);
    const p = E.point(ST.at);
    V.x = V.cw / 2 - p.x * V.k; V.y = V.ch / 2 - p.y * V.k;
    const mw = M.W * V.k, mh = M.H * V.k;
    if (mw >= V.cw) V.x = Math.min(0, Math.max(V.cw - mw, V.x));
    if (mh >= V.ch) V.y = Math.min(0, Math.max(V.ch - mh, V.y));
    V.init = true;
    applyView();
  }
  function zoomBy(f, cx, cy) {
    if (cx == null) { cx = V.cw / 2; cy = V.ch / 2; }
    const wx = (cx - V.x) / V.k, wy = (cy - V.y) / V.k;
    V.k *= f; clampView();
    V.x = cx - wx * V.k; V.y = cy - wy * V.k;
    applyView();
  }
  function drawMapState() {
    if (!mapEls) return;
    $$('#cities .city').forEach(g => {
      const c = +g.dataset.c;
      g.classList.toggle('here', c === ST.at && !busy);
      g.classList.toggle('sel', c === mapSel);
    });
    const sheet = $('#sheet'), hint = $('#maphint');
    if (!busy) {
      const p = E.point(ST.at);
      placeShip(p.px, p.py, false);
      mapEls.ship.setAttribute('visibility', 'hidden'); // in porto basta l'anello dorato
      mapEls.wake.setAttribute('hidden', '');
      if (mapSel >= 0 && mapSel !== ST.at) {
        const pts = [[E.point(ST.at).x, E.point(ST.at).y], ...E.route(ST.at, mapSel), [E.point(mapSel).x, E.point(mapSel).y]];
        const ps = pts.map(q => q.join(',')).join(' ');
        mapEls.route.setAttribute('points', ps); mapEls.routebg.setAttribute('points', ps);
        mapEls.route.removeAttribute('hidden'); mapEls.routebg.removeAttribute('hidden');
      } else { mapEls.route.setAttribute('hidden', ''); mapEls.routebg.setAttribute('hidden', ''); }
      if (mapSel >= 0) {
        sheet.innerHTML = sheetHTML(mapSel); sheet.hidden = false; hint.hidden = true;
        const room = sheet.offsetTop - 16, p = E.point(mapSel);
        const sy = p.y * V.k + V.y, sx = p.x * V.k + V.x;
        if (sy > room - 24 || sy < 70) { V.y += (Math.max(80, room * 0.55)) - sy; }
        if (sx < 40 || sx > V.cw - 70) { V.x += V.cw / 2 - sx; }
        applyView();
      } else { sheet.hidden = true; hint.hidden = hintSeen; }
    }
    scaleMarks();
  }
  function sheetHTML(c) {
    const here = c === ST.at;
    const kn = ST.known[c];
    let trip = '';
    if (here) trip = `<p class="trip">La tua nave è ormeggiata qui.</p>`;
    else {
      const d = E.travelDays(ST, c), nm = E.distance(ST.at, c);
      trip = `<p class="trip"><b>${giorni(d)} di mare</b> · ${fmt(nm)} miglia · ciurma ${fmt(d * SH[ST.ship.type].upk)} tarì${E.isWinter(ST.day) ? ' · d\'inverno si va più piano' : ''}</p>`;
    }
    const used = E.cargoUsed(ST);
    const line = arr => arr.map(id => `<span class="sg">${gicon(E.GI[id])}${G[E.GI[id]].s.toLowerCase()}</span>`).join(' ');
    return `<div class="sh-h"><h2>${esc(cname(c))}</h2><button class="xbtn" type="button" data-act="close-sheet" aria-label="Chiudi">×</button></div>
      ${trip}
      <p class="specline"><b>Produce</b> ${line(C[c].P)}</p>
      <p class="specline"><b>Cerca</b> ${line(C[c].N)}</p>
      ${newsHTML(c)}
      <p class="known">${here ? `In stiva ${used} carichi su ${E.capacity(ST)}.` : kn ? `Prezzi che conosci: di ${ago(kn.day)}.` : 'Non ci sei ancora stato: i suoi prezzi non li conosci.'}</p>
      <div class="sh-act">${here ? `<button class="btn main" type="button" data-act="goto-market">Vai al mercato</button>` : `<button class="btn buy" type="button" data-act="sail" data-c="${c}">Salpa per ${esc(cname(c))}</button>`}
        <button class="btn ghost" type="button" data-act="city-listino" data-c="${c}">Listino</button></div>`;
  }
  let mapBound = false;
  function bindMap() {
    const svg = mapEls.svg;
    const pts = new Map();
    let drag = null, pinch = null;
    svg.addEventListener('pointerdown', e => {
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* puntatore non catturabile */ }
      if (!hintSeen) { hintSeen = true; const h = $('#maphint'); if (h) h.hidden = true; }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, vx: V.x, vy: V.y, moved: false, target: e.target };
      else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const r = svg.getBoundingClientRect();
        const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: V.k, wx: (mx - V.x) / V.k, wy: (my - V.y) / V.k };
        if (drag) drag.moved = true;
      }
    });
    svg.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2 && pinch) {
        const [a, b] = [...pts.values()];
        const r = svg.getBoundingClientRect();
        const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
        V.k = pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
        clampView();
        V.x = mx - pinch.wx * V.k; V.y = my - pinch.wy * V.k;
        applyView();
      } else if (pts.size === 1 && drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!drag.moved && Math.hypot(dx, dy) > 7) { drag.moved = true; svg.classList.add('dragging'); }
        if (drag.moved) { V.x = drag.vx + dx; V.y = drag.vy + dy; applyView(); }
      }
    });
    const end = e => {
      if (!pts.has(e.pointerId)) return;
      pts.delete(e.pointerId);
      if (pts.size === 1) { const [p] = [...pts.values()]; drag = { x: p.x, y: p.y, vx: V.x, vy: V.y, moved: true }; pinch = null; return; }
      if (pts.size === 0) {
        svg.classList.remove('dragging');
        if (drag && !drag.moved && e.type === 'pointerup') tapMap(drag.target);
        drag = null; pinch = null;
      }
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('wheel', e => {
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      zoomBy(Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    svg.addEventListener('keydown', e => {
      if (e.key === '+' || e.key === '=') zoomBy(1.3); else if (e.key === '-') zoomBy(1 / 1.3);
    });
    if (!mapBound) {
      window.addEventListener('resize', () => { if (TAB === 'mappa' && mapEls && document.contains(mapEls.svg)) { sizeMap(); applyView(); } });
      mapBound = true;
    }
  }
  function tapMap(target) {
    if (busy) return;
    const g = target && target.closest ? target.closest('.city') : null;
    mapSel = g ? +g.dataset.c : -1;
    drawMapState();
  }

  // ---------- il viaggio animato ----------
  function startVoyage(to) {
    if (busy || to === ST.at) return;
    const from = ST.at, fromDay = ST.day;
    const res = E.sail(ST, to);
    if (!res) return;
    save();
    busy = true; skipVoyage = false; mapSel = -1;
    renderNav();
    const pf = E.point(from), pt = E.point(to);
    const pts = [[pf.px, pf.py], ...E.route(from, to), [pt.px, pt.py]];
    const seg = []; let L = 0;
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
    const at = t => {
      let d = t * L;
      for (let i = 0; i < seg.length; i++) {
        if (d <= seg[i] || i === seg.length - 1) { const f = seg[i] ? Math.min(1, d / seg[i]) : 1; const a = pts[i], b = pts[i + 1]; return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, i, dir: b[0] - a[0] }; }
        d -= seg[i];
      }
      return { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1], i: seg.length - 1, dir: 1 };
    };
    const ps = pts.map(q => q.join(',')).join(' ');
    mapEls.route.setAttribute('points', ps); mapEls.routebg.setAttribute('points', ps);
    mapEls.route.removeAttribute('hidden'); mapEls.routebg.removeAttribute('hidden');
    mapEls.wake.removeAttribute('hidden');
    $('#sheet').hidden = true; $('#maphint').hidden = true;
    drawMapState();
    mapEls.ship.removeAttribute('visibility');
    mapEls.world.appendChild(mapEls.ship); // in viaggio la nave sta sopra ai nomi
    // la nave in primo piano: centra la rotta
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);
    const kFit = Math.min((V.cw - 60) / Math.max(40, bx1 - bx0), (V.ch - 170) / Math.max(40, by1 - by0));
    V.k = Math.min(V.k * 1.0 + 0, Math.max(kLimits()[0], kFit));
    V.x = V.cw / 2 - (bx0 + bx1) / 2 * V.k; V.y = (V.ch + 110) / 2 - (by0 + by1) / 2 * V.k;
    applyView();

    const vo = $('#voyage');
    const notes = res.notes.map(n => `<li>${esc(n)}</li>`).join('');
    vo.innerHTML = `<div class="vrow"><span>In mare verso <b class="dest">${esc(cname(to))}</b></span><button class="btn small" type="button" data-act="skip">Arriva subito</button></div>
      <div class="vrow"><span class="days" id="v-days"></span><span class="muted">${fmt(res.nm)} miglia</span></div>
      <div class="vbar"><i id="v-bar"></i></div><ul id="v-news">${notes}</ul>`;
    vo.hidden = false;
    const total = reduced() ? 700 : Math.min(6500, Math.max(1600, 1100 + res.days * 420));
    const t0 = performance.now();
    let shownDay = 0;
    const wakePts = [pts[0]];
    const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const step = now => {
      if (!mapEls || !document.contains(mapEls.svg)) { finishVoyage(to); return; }
      let t = Math.min(1, (now - t0) / total);
      if (skipVoyage) t = 1;
      const p = at(ease(t));
      placeShip(p.x, p.y, p.dir < 0);
      while (wakePts.length <= p.i) wakePts.push(pts[wakePts.length]);
      mapEls.wake.setAttribute('points', [...wakePts, [p.x, p.y]].map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' '));
      const day = Math.min(res.days, Math.floor(ease(t) * res.days) + 1);
      if (day !== shownDay) {
        for (let d = shownDay; d < day; d++) {
          const n = res.dayNews[d] || [];
          n.forEach(txt => { $('#v-news').insertAdjacentHTML('beforeend', `<li>${esc(txt)}</li>`); });
        }
        shownDay = day;
        $('#v-days').textContent = `Giorno ${day} di ${res.days}`;
        renderTop({ day: fromDay + day });
      }
      $('#v-bar').style.width = (t * 100).toFixed(1) + '%';
      if (t < 1) requestAnimationFrame(step);
      else setTimeout(() => finishVoyage(to), skipVoyage ? 50 : 450);
    };
    requestAnimationFrame(step);
  }
  function finishVoyage(to) {
    if (!busy) return;
    busy = false;
    TAB = 'mercato';
    window.scrollTo(0, 0); render();
    const ev = ST.events.filter(e => e.c === to).length;
    toast(`Sei arrivato a ${esc(cname(to))}.${ev ? ' In porto girano notizie.' : ''}`, 3400);
    checkFlash();
  }

  // ---------- LISTINO ----------
  function viewListino() {
    const seg = `<div class="seg" role="group" aria-label="Vista del listino">
      <button type="button" data-act="lis-mode" data-v="merce" aria-pressed="${LIS.mode === 'merce'}">Per merce</button>
      <button type="button" data-act="lis-mode" data-v="porto" aria-pressed="${LIS.mode === 'porto'}">Per porto</button></div>`;
    return `<div class="port"><div class="port-h"><h1>Listino</h1><span class="tag">i prezzi che conosci</span></div>
      <p class="desc">Il listino ricorda i prezzi dell'ultima volta che sei stato in ogni porto. Più sono vecchi, più possono essere cambiati.</p></div>
      ${seg}${LIS.mode === 'merce' ? listinoMerce() : listinoPorto()}`;
  }
  function rerenderListino() {
    const sx = $('.scrollrow') ? $('.scrollrow').scrollLeft : 0;
    $('#view').innerHTML = viewListino();
    const r = $('.scrollrow'); if (r) r.scrollLeft = sx;
  }
  function priceAt(c, g) {
    if (c === ST.at) return { s: E.sellPrice(ST, c, g), b: E.available(ST, c, g) ? E.buyPrice(ST, c, g) : null, a: E.available(ST, c, g), day: ST.day, live: true };
    const k = ST.known[c]; if (!k) return null;
    return { s: k.s[g], b: k.b[g], a: k.a[g], day: k.day };
  }
  function listinoMerce() {
    const g = LIS.g;
    const picks = `<div class="scrollrow" role="group" aria-label="Scegli la merce">${G.map((x, i) => `<button type="button" class="pick${i === g ? ' on' : ''}" data-lg="${i}" aria-pressed="${i === g}">${gicon(i)}${x.s}</button>`).join('')}</div>`;
    const prod = C.map((c, i) => c.P.includes(G[g].id) ? cname(i) : null).filter(Boolean);
    const need = C.map((c, i) => c.N.includes(G[g].id) ? cname(i) : null).filter(Boolean);
    const rows = C.map((_, c) => ({ c, p: priceAt(c, g) }));
    const key = LIS.sort === 'vendi' ? (r => r.p ? -r.p.s : 1e9) : (r => r.p && r.p.b ? r.p.b : 1e9);
    rows.sort((a, b) => key(a) - key(b) || (E.distance(ST.at, a.c) - E.distance(ST.at, b.c)));
    const bestC = rows[0] && rows[0].p ? rows[0].c : -1;
    const tr = rows.map(({ c, p }) => {
      const role = C[c].P.includes(G[g].id) ? 'produce' : C[c].N.includes(G[g].id) ? 'cerca' : '';
      const sub = c === ST.at ? 'sei qui' : `${giorni(E.travelDays(ST, c))} di mare${role ? ' · ' + role : ''}`;
      if (!p) return `<tr><td class="cn">${esc(cname(c))}<small>${sub}</small><small>mai visitato</small></td><td class="unk">—</td><td class="unk">—</td></tr>`;
      return `<tr class="${c === ST.at ? 'here' : ''}${c === bestC ? ' best' : ''}"><td class="cn">${esc(cname(c))}<small>${sub}</small>${p.live ? '' : `<small>prezzi di ${ago(p.day)}</small>`}</td>
        <td class="${LIS.sort === 'vendi' ? 'strong' : ''}">${p.s}</td><td class="${LIS.sort === 'compri' ? 'strong' : ''}">${p.b ?? '—'}</td></tr>`;
    }).join('');
    const h = ST.ship.cargo[g];
    return `${picks}
      <div class="box"><h3 style="display:flex;align-items:center;gap:8px">${gicon(g)} ${esc(G[g].n)}</h3>
        <p class="muted">Prezzo di base ${G[g].p} tarì per ${G[g].u[0]}.${h.q ? ` Nella stiva: ${h.q} ${E.unit(g, h.q)}, pagate in media ${Math.round(h.cost / h.q)}.` : ''}</p>
        <p class="muted">Si produce a ${prod.join(', ')}. Si cerca a ${need.join(', ')}.</p></div>
      <div class="seg" role="group" aria-label="Ordina"><button type="button" data-act="lis-sort" data-v="vendi" aria-pressed="${LIS.sort === 'vendi'}">Dove vendere</button><button type="button" data-act="lis-sort" data-v="compri" aria-pressed="${LIS.sort === 'compri'}">Dove comprare</button></div>
      <div class="tablewrap"><table class="lt"><thead><tr><th>Porto</th><th>Min<br>vendi a</th><th>Max<br>compri a</th></tr></thead><tbody>${tr}</tbody></table></div>`;
  }
  function listinoPorto() {
    if (LIS.c < 0) LIS.c = ST.at;
    const c = LIS.c;
    const picks = `<div class="scrollrow" role="group" aria-label="Scegli il porto">${C.map((_, i) => `<button type="button" class="pick plain${i === c ? ' on' : ''}" data-lc="${i}" aria-pressed="${i === c}">${esc(cname(i))}${i === ST.at ? ' ·' : ''}</button>`).join('')}</div>`;
    const known = c === ST.at || ST.known[c];
    const head = `<div class="box"><h3>${esc(cname(c))}</h3><p class="muted">${esc(C[c].d)}</p>${specHTML(c)}
      <p class="muted">${c === ST.at ? 'Sei qui: prezzi di adesso.' : ST.known[c] ? `Prezzi di ${ago(ST.known[c].day)}. Da qui ${giorni(E.travelDays(ST, c))} di mare.` : `Non ci sei mai stato. Da qui ${giorni(E.travelDays(ST, c))} di mare.`}</p></div>`;
    if (!known) return picks + head;
    const tr = G.map((_, g) => {
      const p = priceAt(c, g), h = ST.ship.cargo[g];
      return `<tr><td><span class="gn">${gicon(g)}${G[g].s}</span></td><td class="strong">${p.s}</td><td class="strong">${p.b ?? '—'}</td><td>${p.a ? fmt(p.a) : '—'}</td><td>${h.q ? h.q : ''}</td></tr>`;
    }).join('');
    return `${picks}${head}<div class="tablewrap"><table class="lt"><thead><tr><th>Merce</th><th>Min<br>vendi a</th><th>Max<br>compri a</th><th>Porto</th><th>Stiva</th></tr></thead><tbody>${tr}</tbody></table></div>`;
  }

  // ---------- NAVE ----------
  function viewNave() {
    const t = ST.ship.type, s = SH[t];
    const used = E.cargoUsed(ST);
    const cargo = G.map((_, g) => ST.ship.cargo[g].q ? g : -1).filter(g => g >= 0);
    const cargoHTML = cargo.length ? `<ul class="cargo-list">${cargo.map(g => { const h = ST.ship.cargo[g]; return `<li>${gicon(g)}<span><b>${h.q} ${E.unit(g, h.q)} di ${G[g].n.toLowerCase()}</b><small>pagate in media ${Math.round(h.cost / h.q)} tarì</small></span><b class="num">${fmt(h.cost)}</b></li>`; }).join('')}</ul>` : '<p class="muted">La stiva è vuota.</p>';
    const yard = C[ST.at].yard;
    const yards = C.map((c, i) => c.yard ? cname(i) : null).filter(Boolean).join(', ');
    const ships = SH.map((x, i) => {
      if (i === t) return `<div class="yship cur"><h4>${x.n} · la tua</h4><p>${x.cap} carichi · ${x.spd} miglia al giorno · ciurma ${x.upk} tarì al giorno</p></div>`;
      if (!yard) return `<div class="yship"><h4>${x.n} · ${fmt(x.cost)} tarì</h4><p>${esc(x.d)} ${x.cap} carichi · ${x.spd} miglia al giorno · ciurma ${x.upk} tarì al giorno.</p></div>`;
      const q = E.shipQuote(ST, i);
      let why = '';
      if (!yard) why = 'Serve un cantiere';
      else if (!q.fits) why = 'Il carico non entra';
      else if (ST.money < q.net) why = `Mancano ${fmt(q.net - ST.money)} tarì`;
      const cost = q.net >= 0 ? `Spesa netta ${fmt(q.net)} tarì` : `Ci guadagni ${fmt(-q.net)} tarì`;
      return `<div class="yship"><h4>${x.n} · ${fmt(x.cost)} tarì</h4>
        <p>${esc(x.d)} ${x.cap} carichi · ${x.spd} miglia al giorno · ciurma ${x.upk} tarì al giorno. ${cost}.</p>
        <button class="btn small ${q.can ? 'buy' : ''}" type="button" data-act="buyship" data-t="${i}" ${q.can ? '' : 'disabled'}>${q.can ? 'Compra' : why}</button></div>`;
    }).join('');
    return `<section class="box">
        <div class="shiphead">${icon('u-nave')}<div><h2>${esc(ST.ship.name)}</h2><p class="muted">${s.n} · ${esc(s.d)}</p></div></div>
        <div class="statgrid">
          <div class="stat"><span>Stiva</span><b>${used} / ${s.cap}</b></div>
          <div class="stat"><span>Velocità</span><b>${s.spd} miglia</b></div>
          <div class="stat"><span>Ciurma al giorno</span><b>${s.upk} tarì</b></div>
          <div class="stat"><span>Valore</span><b>${fmt(E.shipValue(ST))} tarì</b></div>
        </div>
        <label class="field"><span>Nome della nave</span><input id="in-shipname" class="inp" maxlength="24" value="${esc(ST.ship.name)}"></label>
      </section>
      <section class="box"><h3>Nella stiva</h3>${cargoHTML}</section>
      <section class="box yard"><h3>Cantiere${yard ? ` di ${esc(cname(ST.at))}` : ''}</h3>
        <p class="muted">${yard ? `Il cantiere ritira la tua ${s.n.toLowerCase()} per ${fmt(E.shipValue(ST))} tarì e ti vende la nuova.` : `Qui non si costruiscono navi. Cantieri a ${yards}.`}</p>
        ${ships}</section>`;
  }

  // ---------- MERCANTE ----------
  function viewMercante() {
    const r = E.rankIndex(ST), nx = RK[r + 1];
    const pct = nx ? Math.min(100, 100 * (ST.prestige - RK[r].p) / (nx.p - RK[r].p)) : 100;
    const b = ST.stats.best;
    const ladder = RK.map((x, i) => `<li class="${i < r ? 'done' : i === r ? 'cur' : 'todo'}"><span>${x.n}</span><span class="num">${fmt(x.p)}</span></li>`).join('');
    const icons = { news: 'u-news', trade: 'u-mercato', travel: 'u-nave', rank: 'u-rank', ship: 'u-anchor' };
    const diary = ST.log.slice(0, 60).map(l => `<li class="d-${l.t}">${icon(icons[l.t] || 'u-news')}<span><time>${E.dateText(l.d)}</time>${esc(l.txt)}</span></li>`).join('');
    return `<section class="box">
        <p class="muted">${esc(ST.name)}, mercante di Palermo</p>
        <div class="rankname">${esc(RK[r].n)}</div>
        <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct.toFixed(1)}%"></i></div>
        <p class="muted">Prestigio ${fmt(ST.prestige)}${nx ? ` · per diventare ${nx.n} ne servono ${fmt(nx.p)}` : ' · il grado più alto'}. Ogni ${E.CFG.prestigePer} tarì di guadagno danno un punto.</p>
      </section>
      <section class="statgrid">
        <div class="stat"><span>In cassa</span><b>${fmt(ST.money)} tarì</b></div>
        <div class="stat"><span>Patrimonio</span><b>${fmt(E.netWorth(ST))} tarì</b></div>
        ${ST.debt > 0 ? `<div class="stat"><span>Debito col banco</span><b class="down">${fmt(ST.debt)} tarì</b></div>` : ''}
        <div class="stat"><span>Guadagni</span><b>${fmt(ST.stats.profit)} tarì</b></div>
        <div class="stat"><span>Paghe della ciurma</span><b>${fmt(ST.stats.upkeep)} tarì</b></div>
        <div class="stat"><span>Viaggi</span><b>${fmt(ST.stats.voyages)}</b></div>
        <div class="stat"><span>Miglia di mare</span><b>${fmt(ST.stats.miles)}</b></div>
        <div class="stat"><span>Giorni di commercio</span><b>${fmt(ST.day)}</b></div>
        <div class="stat"><span>Miglior affare</span><b>${b ? `${fmt(b.v)} tarì` : '—'}</b>${b ? `<small class="muted">${G[b.g].s.toLowerCase()} a ${esc(cname(b.c))}</small>` : ''}</div>
      </section>
      <section class="box"><h3>I gradi</h3><ul class="ladder">${ladder}</ul></section>
      <section class="box"><h3>Diario</h3><ul class="diary">${diary || '<li>Nessuna voce.</li>'}</ul></section>
      <div class="row2"><button class="btn ghost" type="button" data-act="help">Come si gioca</button><button class="btn ghost" type="button" data-act="title">Schermata iniziale</button><button class="btn ghost" type="button" data-act="restart">Nuova partita</button></div>
      <p class="muted"><a href="${PRIVACY}" target="_blank" rel="noopener">Informativa sulla privacy</a> · Fondaco ${VERSION}, di Salvatore Siciliano</p>`;
  }

  // ---------- avvio ----------
  function boot(data) {
    const d = data || {};
    if (d.st && valid(d.st)) { ST = d.st; if (!(ST.debt >= 0)) ST.debt = 0; enterGame(d.tab || 'mercato'); return; }
    ST = load();
    showTitle();
  }
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => (ST && !busy ? { st: ST, tab: TAB } : ST ? { st: ST, tab: 'mercato' } : {})); } catch (e) { /* facoltativo */ }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
  // accesso per le prove automatiche
  window.__fondaco = {
    get st() { return ST; }, E,
    sail(c) { if (busy || !ST) return false; TAB = 'mappa'; window.scrollTo(0, 0); render(); startVoyage(c); return true; },
    get busy() { return busy; },
  };
})();

</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
</html>
